spring.application.name=smartcheck
spring.datasource.url=jdbc:postgresql://localhost:5432/smartcheck
spring.datasource.username=smartcheck
spring.datasource.password=smartcheck
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.thymeleaf.cache=false
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:}
app.reminders.enabled=${REMINDERS_ENABLED:false}
app.reminders.check-interval=30000
