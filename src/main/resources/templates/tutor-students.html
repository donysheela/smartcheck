<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Students | SmartCheck</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-900">
<header class="bg-slate-950 px-5 py-5 text-white">
    <div class="mx-auto flex max-w-6xl items-center justify-between">
        <a th:href="@{/}" class="font-bold tracking-wide">SmartCheck</a>
        <nav class="flex gap-5 text-sm text-slate-300">
            <a th:href="@{/tutor}" class="hover:text-white">Dashboard</a>
            <a th:href="@{/tutor/sessions}" class="hover:text-white">Recent sessions</a>
            <a th:href="@{/tutor/reports}" class="hover:text-white">Reports</a>
        </nav>
    </div>
</header>
<main class="mx-auto max-w-6xl px-4 py-8 sm:px-6">
    <div class="mb-6 flex flex-wrap items-end justify-between gap-4">
        <div>
            <p class="text-sm font-semibold uppercase tracking-widest text-cyan-700">Tutor workspace</p>
            <h1 class="mt-1 text-3xl font-bold">Students</h1>
        </div>
        <a th:href="@{/tutor}" class="rounded-xl bg-slate-900 px-5 py-3 text-sm font-semibold text-white hover:bg-slate-800">Back to dashboard</a>
    </div>
    <div th:if="${success}" class="mb-4 rounded-xl bg-emerald-100 px-4 py-3 text-emerald-900" th:text="${success}"></div>
    <div th:if="${error}" class="mb-4 rounded-xl bg-rose-100 px-4 py-3 text-rose-900" th:text="${error}"></div>
    <section class="rounded-2xl bg-white p-5 shadow-sm sm:p-7">
        <div th:if="${students.totalElements == 0}" class="text-sm text-slate-500">No students have been added yet.</div>
        <div class="grid gap-3 sm:grid-cols-2 lg:grid-cols-3">
            <article th:each="student : ${students}" class="rounded-xl border border-slate-200 p-4">
                <div class="flex items-start justify-between gap-3">
                    <div>
                        <h2 class="font-semibold"><span th:text="${student.genmoji}" aria-hidden="true"></span> <span th:text="${student.name}"></span></h2>
                        <p class="mt-1 text-sm text-slate-500"><span th:text="${student.gender}"></span> · <span th:text="${student.sessionMinutes}"></span> minute session</p>
                    </div>
                    <form method="post" th:action="@{/tutor/students/{id}/delete(id=${student.id})}"
                          onsubmit="return confirm('Remove this student from the active list? Their session history will be kept.');">
                        <button class="font-medium text-rose-700 hover:text-rose-900">Delete</button>
                    </form>
                </div>
                <p class="mt-3 text-xs font-semibold uppercase tracking-wide text-slate-500">Alert tutors</p>
                <p class="mt-1 text-sm" th:each="assigned : ${student.tutors}" th:text="${assigned.name}"></p>
                <details class="mt-4 border-t border-slate-200 pt-3">
                    <summary class="cursor-pointer text-sm font-semibold text-cyan-700 hover:text-cyan-900">Edit student</summary>
                    <form method="post" th:action="@{/tutor/students/{id}(id=${student.id})}" class="mt-3 space-y-3">
                        <label class="block text-sm font-medium">Name
                            <input required name="name" th:value="${student.name}" class="mt-1 w-full rounded-xl border border-slate-300 px-3 py-2">
                        </label>
                        <fieldset>
                            <legend class="mb-2 text-sm font-medium">Gender</legend>
                            <div class="flex gap-4">
                                <label class="flex items-center gap-2 text-sm"><input required type="radio" name="gender" value="FEMALE" th:checked="${student.gender.name() == 'FEMALE'}" class="accent-cyan-700"> Female</label>
                                <label class="flex items-center gap-2 text-sm"><input type="radio" name="gender" value="MALE" th:checked="${student.gender.name() == 'MALE'}" class="accent-cyan-700"> Male</label>
                            </div>
                        </fieldset>
                        <label class="block text-sm font-medium">Session length (minutes)
                            <input required type="number" min="1" max="480" name="sessionMinutes" th:value="${student.sessionMinutes}" class="mt-1 w-full rounded-xl border border-slate-300 px-3 py-2">
                        </label>
                        <fieldset>
                            <legend class="mb-2 text-sm font-medium">Alert these tutors</legend>
                            <div class="grid gap-2">
                                <label th:each="tutor : ${tutors}" class="flex items-center gap-2 rounded-lg border border-slate-200 p-3 text-sm">
                                    <input type="checkbox" name="tutorIds" th:value="${tutor.id}" th:checked="${student.tutors.contains(tutor)}" class="h-4 w-4 accent-cyan-700">
                                    <span><span class="block font-medium" th:text="${tutor.name}"></span><span class="text-slate-500" th:text="${tutor.email}"></span></span>
                                </label>
                            </div>
                        </fieldset>
                        <button class="w-full rounded-xl bg-cyan-700 px-4 py-2.5 font-semibold text-white hover:bg-cyan-800">Save changes</button>
                    </form>
                </details>
            </article>
        </div>
        <nav th:if="${students.totalPages > 1}" class="mt-6 flex items-center justify-between border-t border-slate-200 pt-4" aria-label="Student pages">
            <a th:if="${students.hasPrevious()}" th:href="@{/tutor/students(page=${students.number - 1})}"
               class="rounded-lg border border-slate-300 px-4 py-2 text-sm font-medium hover:bg-slate-50">Previous</a>
            <span th:unless="${students.hasPrevious()}" class="px-4 py-2 text-sm text-slate-400">Previous</span>
            <span class="text-sm text-slate-600">Page <span th:text="${students.number + 1}"></span> of <span th:text="${students.totalPages}"></span></span>
            <a th:if="${students.hasNext()}" th:href="@{/tutor/students(page=${students.number + 1})}"
               class="rounded-lg border border-slate-300 px-4 py-2 text-sm font-medium hover:bg-slate-50">Next</a>
            <span th:unless="${students.hasNext()}" class="px-4 py-2 text-sm text-slate-400">Next</span>
        </nav>
    </section>
</main>
</body>
</html>
