<div xmlns:th="http://www.thymeleaf.org" th:fragment="loadingIndicator">
    <style>
        @keyframes smartcheck-spin {
            to { transform: rotate(360deg); }
        }

        .smartcheck-spinner {
            display: inline-block;
            width: 1.15rem;
            height: 1.15rem;
            flex: 0 0 auto;
            border: 3px solid currentColor;
            border-right-color: transparent;
            border-radius: 50%;
            animation: smartcheck-spin 0.7s linear infinite;
        }

        .smartcheck-loading-overlay {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: grid;
            place-items: center;
            padding: 1.5rem;
            background: rgb(15 23 42 / 55%);
            backdrop-filter: blur(5px);
        }

        .smartcheck-loading-overlay[hidden] {
            display: none;
        }
    </style>
    <div data-smartcheck-loading-overlay class="smartcheck-loading-overlay" hidden
         role="status" aria-live="assertive" aria-atomic="true">
        <div class="flex min-w-56 items-center gap-4 rounded-2xl bg-white px-6 py-5 text-slate-900 shadow-2xl ring-1 ring-white/50">
            <span class="smartcheck-spinner h-9 w-9 border-4 text-cyan-600" aria-hidden="true"></span>
            <span>
                <span class="block font-semibold">Just a moment</span>
                <span class="block text-sm text-slate-500">Your request is processing…</span>
            </span>
        </div>
    </div>
    <script>
        (() => {
            const overlay = document.querySelector("[data-smartcheck-loading-overlay]");
            let loading = false;

            function showLoading() {
                if (loading) {
                    return false;
                }
                loading = true;
                overlay.hidden = false;
                document.body.setAttribute("aria-busy", "true");
                return true;
            }

            function hideLoading() {
                loading = false;
                overlay.hidden = true;
                document.body.removeAttribute("aria-busy");
            }

            function showButtonLoading(button) {
                if (!button || button.dataset.loadingApplied) {
                    return;
                }
                button.dataset.loadingApplied = "true";
                button.setAttribute("aria-disabled", "true");
                button.classList.add("pointer-events-none", "opacity-70");
                const spinner = document.createElement("span");
                spinner.className = "smartcheck-spinner mr-2 align-middle";
                spinner.dataset.loadingSpinner = "true";
                spinner.setAttribute("aria-hidden", "true");
                button.prepend(spinner);
            }

            function resetButtonLoading(button) {
                if (!button) {
                    return;
                }
                button.querySelector("[data-loading-spinner]")?.remove();
                delete button.dataset.loadingApplied;
                button.removeAttribute("aria-disabled");
                button.classList.remove("pointer-events-none", "opacity-70");
            }

            async function downloadFile(link) {
                if (!showLoading()) {
                    return;
                }
                showButtonLoading(link);
                try {
                    const response = await fetch(link.href, {credentials: "same-origin"});
                    if (!response.ok) {
                        throw new Error(`File download failed (${response.status}).`);
                    }
                    const file = await response.blob();
                    const disposition = response.headers.get("Content-Disposition") || "";
                    const filename = disposition.match(/filename="([^"]+)"/i)?.[1] || "download";
                    const downloadUrl = URL.createObjectURL(file);
                    const downloadLink = document.createElement("a");
                    downloadLink.href = downloadUrl;
                    downloadLink.download = filename;
                    document.body.appendChild(downloadLink);
                    downloadLink.click();
                    downloadLink.remove();
                    window.setTimeout(() => URL.revokeObjectURL(downloadUrl), 1000);
                } catch (error) {
                    console.error(error);
                    window.alert("The Excel report could not be downloaded. Please try again.");
                } finally {
                    resetButtonLoading(link);
                    hideLoading();
                }
            }

            document.addEventListener("submit", event => {
                if (event.defaultPrevented) {
                    return;
                }
                if (!showLoading()) {
                    event.preventDefault();
                    return;
                }
                showButtonLoading(event.submitter);
            });

            document.addEventListener("click", event => {
                const link = event.target.closest("a[href]");
                if (!link || event.defaultPrevented || event.button !== 0
                        || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey
                        || link.target && link.target !== "_self"
                        || link.hasAttribute("data-no-loading")
                        || link.getAttribute("href").startsWith("#")
                        || /^(mailto|tel|javascript):/i.test(link.getAttribute("href"))) {
                    return;
                }
                if (link.hasAttribute("data-loading-download")) {
                    event.preventDefault();
                    downloadFile(link);
                    return;
                }
                if (link.hasAttribute("download")) {
                    return;
                }
                if (!showLoading()) {
                    event.preventDefault();
                }
            });

            window.addEventListener("pageshow", () => {
                hideLoading();
            });
        })();
    </script>
</div>
