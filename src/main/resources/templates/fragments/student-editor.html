<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="studentEditor(student, tutors)">
    <form method="post" th:action="@{/tutor/students/{id}(id=${student.id})}" class="mt-3 w-full space-y-3 text-left">
        <label class="block text-sm font-medium">Name
            <input required name="name" th:value="${student.name}" class="mt-1 w-full rounded-xl border border-slate-300 px-3 py-2">
        </label>
        <fieldset>
            <legend class="mb-2 text-sm font-medium">Gender</legend>
            <div class="flex gap-4">
                <label class="flex items-center gap-2 text-sm"><input required type="radio" name="gender" value="FEMALE" th:checked="${student.gender.name() == 'FEMALE'}" class="accent-cyan-700"> Female</label>
                <label class="flex items-center gap-2 text-sm"><input type="radio" name="gender" value="MALE" th:checked="${student.gender.name() == 'MALE'}" class="accent-cyan-700"> Male</label>
            </div>
        </fieldset>
        <label class="block text-sm font-medium">Session length (minutes)
            <input required type="number" min="1" max="480" name="sessionMinutes" th:value="${student.sessionMinutes}" class="mt-1 w-full rounded-xl border border-slate-300 px-3 py-2">
        </label>
        <fieldset>
            <legend class="mb-2 text-sm font-medium">Alert these tutors</legend>
            <div class="grid gap-2">
                <label th:each="tutor : ${tutors}" class="flex items-center gap-2 rounded-lg border border-slate-200 p-3 text-sm">
                    <input type="checkbox" name="tutorIds" th:value="${tutor.id}" th:checked="${student.hasTutor(tutor)}" class="h-4 w-4 accent-cyan-700">
                    <span><span class="block font-medium" th:text="${tutor.name}"></span><span class="text-slate-500" th:text="${tutor.email}"></span></span>
                </label>
            </div>
        </fieldset>
        <button class="w-full rounded-xl bg-cyan-700 px-4 py-2.5 font-semibold text-white hover:bg-cyan-800">Save changes</button>
    </form>
</th:block>
