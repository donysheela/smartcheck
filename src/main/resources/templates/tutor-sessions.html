<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Recent sessions | SmartCheck</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-900">
<header class="bg-slate-950 px-5 py-5 text-white">
    <div class="mx-auto flex max-w-6xl items-center justify-between">
        <a th:href="@{/}" class="font-bold tracking-wide">SmartCheck</a>
        <nav class="flex gap-5 text-sm text-slate-300">
            <a th:href="@{/tutor}" class="hover:text-white">Dashboard</a>
            <a th:href="@{/tutor/students}" class="hover:text-white">Students</a>
            <a th:href="@{/tutor/reports}" class="hover:text-white">Reports</a>
        </nav>
    </div>
</header>
<main class="mx-auto max-w-6xl px-4 py-8 sm:px-6">
    <div class="mb-6 flex flex-wrap items-end justify-between gap-4">
        <div>
            <p class="text-sm font-semibold uppercase tracking-widest text-cyan-700">Tutor workspace</p>
            <h1 class="mt-1 text-3xl font-bold">Recent sessions</h1>
            <p class="mt-2 text-slate-600">In-progress sessions are ordered by soonest completion. Completed sessions follow by date and time.</p>
        </div>
        <a th:href="@{/tutor}" class="rounded-xl bg-slate-900 px-5 py-3 text-sm font-semibold text-white hover:bg-slate-800">Back to dashboard</a>
    </div>
    <section class="rounded-2xl bg-white p-5 shadow-sm sm:p-7">
        <div th:if="${sessions.totalElements == 0}" class="text-sm text-slate-500">Session activity will appear here.</div>
        <div data-sessions-list class="space-y-3">
            <article th:each="recentSession : ${sessions}"
                     data-session-row
                     th:attr="data-in-progress=${recentSession.inProgress},data-ends-at=${recentSession.endsAtMillis},data-started-at=${recentSession.startedAtMillis}"
                     th:classappend="${recentSession.inProgress} ? 'border-emerald-200 bg-emerald-50/50' : 'border-rose-200 bg-rose-50'"
                     class="flex flex-wrap items-center justify-between gap-2 rounded-xl border p-4">
                <div>
                    <p class="font-semibold"><span th:text="${recentSession.session.student.genmoji}" aria-hidden="true"></span> <span th:text="${recentSession.session.student.name}"></span></p>
                    <p class="text-sm text-slate-500" th:text="${recentSession.startedAt}"></p>
                </div>
                <div class="flex items-center gap-3">
                    <span data-session-status th:if="${recentSession.inProgress}" class="rounded-full bg-emerald-100 px-3 py-1 text-sm font-medium text-emerald-800">In progress</span>
                    <span data-session-status th:unless="${recentSession.inProgress}" class="rounded-full bg-rose-100 px-3 py-1 text-sm font-medium text-rose-800">Completed</span>
                    <span data-session-timer th:if="${recentSession.inProgress}" class="min-w-16 text-right font-mono text-lg font-semibold tabular-nums text-slate-700" th:attr="aria-label=${'Time remaining for ' + recentSession.session.student.name}">--:--</span>
                </div>
            </article>
        </div>
        <nav th:if="${sessions.totalPages > 1}" class="mt-6 flex items-center justify-between border-t border-slate-200 pt-4" aria-label="Session pages">
            <a th:if="${sessions.hasPrevious()}" th:href="@{/tutor/sessions(page=${sessions.number - 1})}"
               class="rounded-lg border border-slate-300 px-4 py-2 text-sm font-medium hover:bg-slate-50">Previous</a>
            <span th:unless="${sessions.hasPrevious()}" class="px-4 py-2 text-sm text-slate-400">Previous</span>
            <span class="text-sm text-slate-600">Page <span th:text="${sessions.number + 1}"></span> of <span th:text="${sessions.totalPages}"></span></span>
            <a th:if="${sessions.hasNext()}" th:href="@{/tutor/sessions(page=${sessions.number + 1})}"
               class="rounded-lg border border-slate-300 px-4 py-2 text-sm font-medium hover:bg-slate-50">Next</a>
            <span th:unless="${sessions.hasNext()}" class="px-4 py-2 text-sm text-slate-400">Next</span>
        </nav>
    </section>
</main>
<script>
    const sessionsList = document.querySelector("[data-sessions-list]");
    if (sessionsList) {
        const rows = Array.from(sessionsList.querySelectorAll("[data-session-row]"));

        function orderRows() {
            rows.sort((first, second) => {
                const firstRunning = first.dataset.inProgress === "true";
                const secondRunning = second.dataset.inProgress === "true";
                if (firstRunning !== secondRunning) {
                    return firstRunning ? -1 : 1;
                }
                if (firstRunning) {
                    return Number(first.dataset.endsAt) - Number(second.dataset.endsAt);
                }
                return Number(second.dataset.startedAt) - Number(first.dataset.startedAt);
            });
            rows.forEach(row => sessionsList.appendChild(row));
        }

        function updateTimers() {
            const now = Date.now();
            rows.forEach(row => {
                if (row.dataset.inProgress !== "true") {
                    return;
                }
                const remaining = Math.max(0, Math.ceil((Number(row.dataset.endsAt) - now) / 1000));
                const timer = row.querySelector("[data-session-timer]");
                const status = row.querySelector("[data-session-status]");
                if (timer) {
                    timer.textContent = `${String(Math.floor(remaining / 60)).padStart(2, "0")}:${String(remaining % 60).padStart(2, "0")}`;
                }
                if (remaining === 0) {
                    row.dataset.inProgress = "false";
                    row.classList.remove("border-emerald-200", "bg-emerald-50/50");
                    row.classList.add("border-rose-200", "bg-rose-50");
                    if (status) {
                        status.textContent = "Completed";
                        status.classList.remove("bg-emerald-100", "text-emerald-800");
                        status.classList.add("bg-rose-100", "text-rose-800");
                    }
                    if (timer) {
                        timer.classList.remove("text-slate-700");
                        timer.classList.add("text-rose-800");
                    }
                }
            });
            orderRows();
        }

        orderRows();
        updateTimers();
        if (rows.some(row => row.dataset.inProgress === "true")) {
            window.setInterval(updateTimers, 1000);
        }
    }
</script>
</body>
</html>
